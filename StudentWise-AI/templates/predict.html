<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyWise AI - Performance Analysis</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="form-page">

        <div class="form-header">

            <a href="/" class="back-link">
                ← StudyWise AI
            </a>

            <h1>Student Performance Analysis</h1>

            <p>
                Enter your academic information to receive
                an AI-powered performance prediction.
            </p>

        </div>


        <div class="form-card">

            <form action="/predict" method="POST">

                <div class="section-title">
                    <h2>Student Information</h2>
                    <p>Enter your basic academic information.</p>
                </div>


                <div class="form-group">

                    <label for="gender">Gender</label>

                    <select id="gender" name="gender" required>

                        <option value="">
                            Select gender
                        </option>

                        <option value="female">
                            Female
                        </option>

                        <option value="male">
                            Male
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="race">
                        Race / Ethnicity
                    </label>

                    <select id="race" name="race" required>

                        <option value="">
                            Select group
                        </option>

                        <option value="group A">Group A</option>
                        <option value="group B">Group B</option>
                        <option value="group C">Group C</option>
                        <option value="group D">Group D</option>
                        <option value="group E">Group E</option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="parental_education">
                        Parental Education
                    </label>

                    <select
                        id="parental_education"
                        name="parental_education"
                        required
                    >

                        <option value="">
                            Select education level
                        </option>

                        <option value="master's degree">
                            Master's degree
                        </option>

                        <option value="bachelor's degree">
                            Bachelor's degree
                        </option>

                        <option value="associate's degree">
                            Associate's degree
                        </option>

                        <option value="some college">
                            Some college
                        </option>

                        <option value="high school">
                            High school
                        </option>

                        <option value="some high school">
                            Some high school
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="lunch">
                        Lunch
                    </label>

                    <select id="lunch" name="lunch" required>

                        <option value="">
                            Select lunch type
                        </option>

                        <option value="standard">
                            Standard
                        </option>

                        <option value="free/reduced">
                            Free / Reduced
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="test_prep">
                        Test Preparation Course
                    </label>

                    <select
                        id="test_prep"
                        name="test_prep"
                        required
                    >

                        <option value="">
                            Select preparation status
                        </option>

                        <option value="completed">
                            Completed
                        </option>

                        <option value="none">
                            None
                        </option>

                    </select>

                </div>


                <div class="section-title">

                    <h2>Academic Scores</h2>

                    <p>
                        Enter your Math and Reading scores.
                    </p>

                </div>


                <div class="form-group">

                    <label for="math_score">
                        Math Score
                    </label>

                    <input
                        type="number"
                        id="math_score"
                        name="math_score"
                        min="0"
                        max="100"
                        placeholder="Enter score from 0 to 100"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="reading_score">
                        Reading Score
                    </label>

                    <input
                        type="number"
                        id="reading_score"
                        name="reading_score"
                        min="0"
                        max="100"
                        placeholder="Enter score from 0 to 100"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="analyze-button"
                >
                    Analyze My Performance →
                </button>

            </form>

        </div>

    </div>

</body>

</html>
